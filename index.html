<!DOCTYPE html>
<head>
  <title>TimeWeb</title>

  <style>
  body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    font-size: 14px;
    position: relative;
    background: rgba(220,102,85,.1);

    background: #8b45133b;
  }
  a {
    text-decoration: none;
    color: inherit;
  }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  header {
    width: calc(100% - 30px);
    margin: 0 auto;
    height: 50px;
    border-radius: 16px;
    margin-top: 10px;
    background: white;
    box-sizing: border-box;
    padding: 0 20px;

    background: #8b4513;
    box-shadow: inset 0 0 0 3px saddlebrown,inset 0 0 0 4px rgb(242 193 157), -3px 3px 5px 0 #0000004f;
    background: linear-gradient(135deg,#8b4513,#964b00,#95500c);
  }

  .header-logo span {
    color: #dc6655;
    font-weight: bold;
    line-height: 50px;
    font-size: 20px;

    color: rgb(242 193 157);
  }

  </style>
</head>
<body>
  <header>
    <div class='header-logo'><span>TimeWeb</span></div>
  </header>
  <nav>

  </nav>
</body>
</html>
